# ============================================================
#  Карточка Lovelace для ворот GATE-WFH
#  Как добавить: Дашборд -> "Добавить карточку" -> "Вручную" (Manual)
#  -> удалить содержимое -> вставить весь код ниже.
#
#  Команды — настоящие кнопки (button) форка xZetsubou.
# ============================================================
type: vertical-stack
title: GATE-WFH
cards:
  # ---- Статус ворот + штатные кнопки открыть/закрыть ----
  - type: tile
    entity: cover.gate_wfh
    name: Ворота
    features:
      - type: cover-open-close

  # ---- Командные кнопки (импульсные DP 101-104, 110) ----
  - type: grid
    columns: 5
    square: false
    cards:
      - type: button
        entity: button.gate_wfh_gate_open
        icon: mdi:gate-arrow-right
        name: Открыть
        tap_action:
          action: perform-action
          perform_action: button.press
          target:
            entity_id: button.gate_wfh_gate_open
      - type: button
        entity: button.gate_wfh_gate_stop
        icon: mdi:stop-circle-outline
        name: Стоп
        tap_action:
          action: perform-action
          perform_action: button.press
          target:
            entity_id: button.gate_wfh_gate_stop
      - type: button
        entity: button.gate_wfh_gate_close
        icon: mdi:gate-arrow-left
        name: Закрыть
        tap_action:
          action: perform-action
          perform_action: button.press
          target:
            entity_id: button.gate_wfh_gate_close
      - type: button
        entity: button.gate_wfh_gate_wicket
        icon: mdi:door
        name: Калитка
        tap_action:
          action: perform-action
          perform_action: button.press
          target:
            entity_id: button.gate_wfh_gate_wicket
      - type: button
        entity: button.gate_wfh_gate_fast_open
        icon: mdi:speedometer
        name: Турбо
        tap_action:
          action: perform-action
          perform_action: button.press
          target:
            entity_id: button.gate_wfh_gate_fast_open

  # ---- Статус и телеметрия ----
  - type: entities
    title: Состояние
    entities:
      - entity: sensor.gate_wfh_gate_status_text
        name: Статус ворот
      - entity: binary_sensor.gate_wfh_gate_open_limit
        name: Концевик открытия
      - entity: binary_sensor.gate_wfh_gate_closed_limit
        name: Концевик закрытия
      - entity: binary_sensor.gate_wfh_gate_fsw
        name: Фотоэлементы (FSW)
      - entity: binary_sensor.gate_wfh_gate_inrf
        name: Вход INRF
      - entity: sensor.gate_wfh_gate_return_state_text
        name: Состояние привода
      - entity: sensor.gate_wfh_gate_wifi_rssi
        name: Уровень Wi-Fi
